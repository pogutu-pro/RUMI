[pytest]
DJANGO_SETTINGS_MODULE = rumi.test_settings
python_files = tests.py test_*.py *_tests.py tests_*.py
testpaths = accounts organizations properties tenants rent ledger paybill accounting agency leasing audit rumia_api support billing
addopts = --reuse-db --nomigrations -p no:warnings
norecursedirs = venv .venv .git
