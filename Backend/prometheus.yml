global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # RUMI Django Application
  - job_name: 'rumi-django'
    static_configs:
      - targets: ['localhost:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # RUMI Custom Metrics (Django)
  - job_name: 'rumi-metrics'
    static_configs:
      - targets: ['localhost:8000']
    metrics_path: '/metrics/django'
    scrape_interval: 10s

  # RUMI Health Check
  - job_name: 'rumi-health'
    static_configs:
      - targets: ['localhost:8000']
    metrics_path: '/health'
    scrape_interval: 30s

  # Redis metrics (if redis_exporter is running)
  - job_name: 'redis'
    static_configs:
      - targets: ['localhost:9121']

  # Celery metrics (if celery_exporter is running)
  - job_name: 'celery'
    static_configs:
      - targets: ['localhost:9540']

  # Node exporter for system metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['localhost:9100']
