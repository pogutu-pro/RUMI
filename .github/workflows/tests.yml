name: 🧪 RUMI Tests - Must Pass to Push

on:
  push:
    branches: ['**']  # All branches
  pull_request:
    branches: ['main', 'develop', 'staging']

# Cancel in-progress runs for same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # BACKEND TESTS
  # ==========================================
  backend:
    name: Backend Tests (Django)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Backend/requirements.txt
          pip install django-filter

      - name: 🔧 Run migrations
        env:
          DEBUG: 'True'
          SECRET_KEY: 'ci-test-secret-key-not-for-production'
        run: |
          cd Backend
          python manage.py migrate --noinput

      - name: 🧪 Run backend tests
        env:
          DEBUG: 'True'
          SECRET_KEY: 'ci-test-secret-key-not-for-production'
        run: |
          cd Backend
          python manage.py test --verbosity=2

  # ==========================================
  # FRONTEND TESTS
  # ==========================================
  frontend:
    name: Frontend Tests (Jest)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: 📦 Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 📦 Install dependencies
        run: |
          cd frontend
          pnpm install

      - name: 🧪 Run unit tests
        run: |
          cd frontend
          pnpm test -- --coverage

  # ==========================================
  # ALL TESTS STATUS CHECK
  # ==========================================
  all-tests:
    name: ✅ All Tests Status
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.backend.result }}" == "success" ] && [ "${{ needs.frontend.result }}" == "success" ]; then
            echo "✅ All tests passed!"
            exit 0
          else
            echo "❌ Some tests failed!"
            echo "Backend: ${{ needs.backend.result }}"
            echo "Frontend: ${{ needs.frontend.result }}"
            exit 1
          fi
