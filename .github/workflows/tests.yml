name: 🧪 RUMI Tests - Must Pass to Push

on:
  push:
    branches: ['**']  # All branches
  pull_request:
    branches: ['main', 'develop', 'staging']

# Cancel in-progress runs for same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # BACKEND TESTS
  # ==========================================
  backend:
    name: Backend Tests (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: rumi_user
          POSTGRES_PASSWORD: rumi_password
          POSTGRES_DB: rumi_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔧 Set PYTHONPATH
        run: echo "PYTHONPATH=$PWD" >> $GITHUB_ENV

      - name: 🧪 Run backend tests
        env:
          DEBUG: 'True'
          SECRET_KEY: 'ci-test-secret-key-not-for-production'
          # rumi/settings.py reads DB_* — without these the suite silently
          # ran on SQLite even though a PostgreSQL service is started above.
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: rumi_test_db
          DB_USER: rumi_user
          DB_PASSWORD: rumi_password
          DB_HOST: localhost
          DB_PORT: 5432
          POSTGRES_SERVER: localhost
          POSTGRES_USER: rumi_user
          POSTGRES_PASSWORD: rumi_password
          POSTGRES_DB: rumi_test_db
          POSTGRES_PORT: 5432
          DATABASE_URL: postgresql+asyncpg://rumi_user:rumi_password@localhost:5432/rumi_test_db
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest

  # ==========================================
  # FRONTEND TESTS
  # ==========================================
  frontend:
    name: Frontend Tests (Jest)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: 📦 Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 📦 Install dependencies
        run: |
          cd frontend
          pnpm install

      - name: 🧪 Run unit tests
        run: |
          cd frontend
          pnpm test -- --passWithNoTests

  # ==========================================
  # ALL TESTS STATUS CHECK
  # ==========================================
  all-tests:
    name: ✅ All Tests Status
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.backend.result }}" == "success" ] && [ "${{ needs.frontend.result }}" == "success" ]; then
            echo "✅ All tests passed!"
            exit 0
          else
            echo "❌ Some tests failed!"
            echo "Backend: ${{ needs.backend.result }}"
            echo "Frontend: ${{ needs.frontend.result }}"
            exit 1
          fi
