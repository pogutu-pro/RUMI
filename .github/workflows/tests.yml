name: 🧪 RUMI Tests - Must Pass to Push

on:
  push:
    branches: ['**']  # All branches
  pull_request:
    branches: ['main', 'develop', 'staging']

# Cancel in-progress runs for same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # BACKEND TESTS
  # ==========================================
  backend:
    name: Backend Tests (Pytest)
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: rumi_test
          POSTGRES_USER: rumi_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Backend/requirements.txt
          pip install pytest pytest-django pytest-cov

      - name: 🔧 Configure Django settings
        run: |
          cd Backend
          export DJANGO_SETTINGS_MODULE=rumi.settings
          python manage.py migrate --noinput

      - name: 🧪 Run backend tests
        run: |
          cd Backend
          python3 payments/run_backend_tests.py --verbose --coverage

      - name: 📊 Upload backend coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./Backend/htmlcov/coverage.xml
          flags: backend
          name: backend-coverage

  # ==========================================
  # FRONTEND TESTS
  # ==========================================
  frontend:
    name: Frontend Tests (Vitest + Playwright)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: 📦 Install dependencies
        run: |
          cd frontend
          pnpm install

      - name: 🧪 Run unit tests
        run: |
          cd frontend
          pnpm test --run --coverage

      - name: 🌐 Install Playwright browsers
        run: |
          cd frontend
          pnpm exec playwright install --with-deps

      - name: 🧪 Run E2E tests
        run: |
          cd frontend
          pnpm exec playwright test

      - name: 📊 Upload frontend coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./frontend/coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage

      - name: 📸 Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ==========================================
  # ALL TESTS STATUS CHECK
  # ==========================================
  all-tests:
    name: ✅ All Tests Status
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.backend.result }}" == "success" ] && [ "${{ needs.frontend.result }}" == "success" ]; then
            echo "✅ All tests passed!"
            exit 0
          else
            echo "❌ Some tests failed!"
            echo "Backend: ${{ needs.backend.result }}"
            echo "Frontend: ${{ needs.frontend.result }}"
            exit 1
          fi

      - name: 🎉 Success notification
        if: success()
        run: |
          echo "::notice title=Tests Passed::All 80+ tests passed successfully! 🎉"

      - name: ❌ Failure notification
        if: failure()
        run: |
          echo "::error title=Tests Failed::Some tests failed. Check logs above for details."
